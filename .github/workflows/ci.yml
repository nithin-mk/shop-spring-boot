name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  # Works around a Postgres/JDK interaction where the JVM reports the host's
  # timezone using a legacy IANA alias (e.g. "Asia/Calcutta") that Postgres's
  # bundled tzdata doesn't recognize, failing the JDBC handshake outright.
  JAVA_TOOL_OPTIONS: -Duser.timezone=UTC

jobs:
  # ── Lint & format ────────────────────────────────────────────────────────
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain

      - name: detekt
        run: ./gradlew detekt --console=plain

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: Compile & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # processResources compiles the static TypeScript sources via npm/tsc.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin --console=plain

      - name: Build jar
        run: ./gradlew bootJar --console=plain

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 7

  # ── Unit/integration tests (JUnit + ArchUnit) + coverage ─────────────────
  unit-tests:
    name: Unit tests, ArchUnit & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # processResources compiles the static TypeScript sources via npm/tsc.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Repository/integration tests spin up their own Postgres via
      # Testcontainers, and ImageStorageServiceTest spins up pgsty/silo
      # (MinIO fork) the same way — both just need the Docker daemon that's
      # already preinstalled on GitHub-hosted Ubuntu runners.
      - name: Run tests with coverage (fails below 85%)
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14

  # ── End-to-end tests (Playwright) ────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies only (cache hit)
        run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # Mirrors compose.yaml (Postgres + MinIO) so the app runs exactly as it
      # does in local development — no mocking, full stack.
      - name: Start Postgres + MinIO
        run: docker compose up -d

      - name: Wait for Postgres + MinIO to be healthy
        run: |
          for i in $(seq 1 30); do
            pg_ok=""
            minio_ok=""
            docker compose exec -T postgres pg_isready -U shop -d shop > /dev/null 2>&1 && pg_ok=1
            curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1 && minio_ok=1
            echo "attempt $i: postgres=${pg_ok:-no} minio=${minio_ok:-no}"
            if [ -n "$pg_ok" ] && [ -n "$minio_ok" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy in time" >&2
          docker compose logs
          exit 1

      # Neither a real Stripe account is required: the e2e suite only checks
      # that the Stripe Checkout widget renders (publishable key only, no
      # charge is made), and mail-sending failures are swallowed by the app
      # so the password-reset flow doesn't need a real SMTP server either.
      - name: Start app server
        env:
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: |
          nohup ./gradlew bootRun --console=plain > bootrun.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "App server did not start in time" >&2
          cat bootrun.log
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload app server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: bootrun.log
          retention-days: 7

      - name: Stop Postgres + MinIO
        if: always()
        run: docker compose down -v

  # ── Aggregate status for branch protection ──────────────────────────────
  ci-success:
    name: CI success
    if: always()
    needs: [lint, build, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed." >&2
            exit 1
          fi
          echo "All jobs passed."
