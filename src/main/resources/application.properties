spring.application.name=shop-spring-boot

# Virtual threads (Project Loom)
spring.threads.virtual.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MinIO object storage (mirrors Node.js MINIO_* env vars)
shop.minio.endpoint=${MINIO_ENDPOINT:localhost}
shop.minio.port=${MINIO_PORT:9000}
shop.minio.secure=${MINIO_SECURE:false}
shop.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
shop.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
shop.minio.bucket=${MINIO_BUCKET:shop-spring-boot}

# Mail (configure via env vars in production)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Stripe (set STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY env vars)
shop.stripe.secret-key=${STRIPE_SECRET_KEY:}
shop.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# Pagination
shop.items-per-page=2

# Logging
logging.level.com.shop=INFO
