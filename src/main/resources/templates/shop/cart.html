<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation(${path})}"></div>

<main>
    <th:block th:if="${!products.isEmpty()}">
        <ul class="cart__item-list">
            <li class="cart__item" th:each="p : ${products}">
                <h1 th:text="${p.product.title}"></h1>
                <h2 th:text="'Quantity: ' + ${p.quantity}"></h2>
                <form action="/cart-delete-item" method="POST">
                    <input type="hidden" th:value="${p.product.id}" name="productId">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn danger" type="submit">Delete</button>
                </form>
            </li>
        </ul>
        <hr>
        <div class="centered">
            <a class="btn" href="/checkout">Order Now!</a>
        </div>
    </th:block>
    <h1 th:if="${products.isEmpty()}">No Products in Cart!</h1>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
