<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation(${path})}"></div>

<main class="centered">
    <h1 th:text="${product.title}"></h1>
    <hr>
    <div class="image">
        <img th:src="${imageUrl}" th:alt="${product.title}">
    </div>
    <h2 th:text="${product.price}"></h2>
    <p th:text="${product.description}"></p>
    <div th:replace="~{fragments/add-to-cart :: addToCart(${product})}" sec:authorize="isAuthenticated()"></div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
