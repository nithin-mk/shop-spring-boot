<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation(${path})}"></div>

<main>
    <div th:if="${errorMessage}" class="user-message user-message--error" th:text="${errorMessage}"></div>
    <form class="login-form" action="/new-password" method="POST">
        <div class="form-control">
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
        </div>
        <input type="hidden" name="passwordToken" th:value="${passwordToken}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn" type="submit">Update Password</button>
    </form>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
