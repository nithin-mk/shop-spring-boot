<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head(${pageTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation(${path})}"></div>

<main>
    <div th:if="${errorMessage}" class="user-message user-message--error" th:text="${errorMessage}"></div>
    <form class="login-form" action="/login" method="POST">
        <div class="form-control">
            <label for="email">E-Mail</label>
            <input type="email" name="email" id="email"
                   th:value="${oldInput != null ? oldInput.email : ''}">
        </div>
        <div class="form-control">
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn" type="submit">Login</button>
    </form>
    <div class="centered">
        <a href="/reset">Reset Password</a>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
